[package]
name = "ocr-gui"
version = "0.1.0"
edition = "2021"
authors = ["ChenZibo <qw.54@163.com>"]
description = "OCR GUI Application based on eGUI and ocr-rs"

[dependencies]
# GUI framework
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# OCR library
ocr-rs = { path = "..", version = "2.0" }

# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# File dialog
rfd = "0.15"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Clipboard
cli-clipboard = "0.4"

# Date/time
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[[bin]]
name = "ocr-gui"
path = "src/main.rs"
